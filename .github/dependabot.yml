version: 2
updates:
  # JavaScript / TypeScript dependencies (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [patch, minor]
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used by CI and release workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  # Swift Package Manager dependencies for the macOS ICA helper.
  # The helper depends on apple/swift-argument-parser; Dependabot's `swift`
  # ecosystem keeps it current. If Dependabot rejects this entry, remove it
  # and track SPM updates manually (see scan-mcp#15).
  - package-ecosystem: swift
    directory: "/swift-helper"
    schedule:
      interval: weekly
      day: monday
